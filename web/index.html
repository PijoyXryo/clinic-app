<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klinik MediQueue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🏥 Klinik MediQueue</h1>
    <nav>
      <a href="#queue">Queue</a>
      <a href="#register">Register</a>
    </nav>
  </header>

  <main>
    <p id="message"></p>

    <section class="card now-serving">
      <p>Now serving</p>
      <h2 id="now-number">—</h2>
      <p id="now-name">No one yet</p>
    </section>

    <section class="card" id="queue">
      <h2>Today's Queue</h2>
      <table>
        <thead>
          <tr><th>#</th><th>Name</th><th>Age</th><th>Fee</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="queue-body"></tbody>
      </table>
      <p><button id="reset" class="secondary">Reset demo data</button></p>
    </section>

    <section class="card" id="register">
      <h2>Register Patient</h2>
      <form id="register-form">
        <label for="name">Full name</label>
        <input id="name" type="text" placeholder="e.g. Ali bin Abu" required>

        <label for="age">Age</label>
        <input id="age" type="number" min="0" max="120" required>

        <button type="submit">Add to queue</button>
      </form>
    </section>
  </main>

  <footer>© 2026 Klinik MediQueue</footer>

  <script src="app.js"></script>
</body>
</html>
