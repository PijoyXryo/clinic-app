<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klinik MediQueue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🏥 Klinik MediQueue</h1>
    <nav>
      <a href="index.html">Queue</a>
      <a href="patients.html">Patients</a>
    </nav>
  </header>

  <main>
    <section class="card now-serving">
      <p>Now serving</p>
      <h2 id="now-number">—</h2>
      <p id="now-name">No one yet</p>
    </section>

    <section class="card">
      <h2>Book Appointment</h2>
      <form id="book-form" novalidate>
        <label for="patientId">Patient ID</label>
        <input id="patientId" type="number" placeholder="Find it on the Patients page">

        <label for="reason">Reason (optional)</label>
        <input id="reason" type="text" placeholder="e.g. Fever">

        <button type="submit" id="book-btn">Add to today's queue</button>
      </form>
      <p id="message"></p>
    </section>

    <section class="card">
      <h2>Today's Queue</h2>
      <table>
        <thead>
          <tr><th>#</th><th>Name</th><th>Age</th><th>Reason</th><th>Fee</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="queue-body">
          <tr><td colspan="7">Loading...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
