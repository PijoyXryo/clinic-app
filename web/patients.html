<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patients – Klinik MediQueue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🏥 Klinik MediQueue</h1>
    <nav>
      <a href="index.html">Queue</a>
      <a href="patients.html">Patients</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <h2>Register Patient</h2>
      <!-- novalidate: turn off browser checks so we can SEE the backend protecting us -->
      <form id="patient-form" novalidate>
        <label for="fullName">Full name</label>
        <input id="fullName" type="text" placeholder="e.g. Ali bin Abu">

        <label for="icNumber">IC number</label>
        <input id="icNumber" type="text" placeholder="e.g. 900101-14-5678">

        <label for="age">Age</label>
        <input id="age" type="number">

        <button type="submit" id="submit-btn">Register</button>
      </form>
      <p id="message"></p>
    </section>

    <section class="card">
      <h2>Latest Patients</h2>
      <table>
        <thead>
          <tr><th>ID</th><th>Name</th><th>IC Number</th><th>Age</th><th>Registered</th></tr>
        </thead>
        <tbody id="patients-body">
          <tr><td colspan="5">Loading...</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="patients.js"></script>
</body>
</html>
