# CI = Continuous Integration.
# Every push and every pull request, GitHub starts fresh Linux machines,
# downloads your code, and checks that every part still builds.
name: CI

on:
  push:
    branches: ["**"]        # any branch
  pull_request:
    branches: [main]        # PRs into main

jobs:
  # ---------- 1. NestJS backend ----------
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Build
        run: npm run build

  # ---------- 2. Next.js frontend ----------
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ---------- 3. PHP Yii2 legacy HIS ----------
  legacy-his:
    name: Legacy HIS (PHP Yii2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-his
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring
          tools: composer

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax check
        run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

  # ---------- 4. Docker images ----------
  # Runs only after the 3 jobs above pass (needs:).
  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend, legacy-his]
    steps:
      - uses: actions/checkout@v5

      - name: Build all images
        run: docker compose build
